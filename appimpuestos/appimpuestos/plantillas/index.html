<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de impuestos a las actividades economicas</title>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css" />
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/default.min.css" />
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/semantic.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.2/themes/base/jquery-ui.css">
    <style>
        #contenedor-ventanas {
            position: relative;
            height: 80vh;
            overflow: hidden;
        }

        .card {
            position: absolute;
            cursor: move;
            z-index: 1000;
            margin: 0;
        }

        .card-body,
        .card-footer {
            cursor: default;
        }
    </style>
</head>

<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">::.. SISTEMA DE IMPUESTOS A LAS ACTIVIDADES ECONOMICAS ..::</a>
            <div class="collapse navbar-collapse" id="mnxImpuestos">
                <div class="navbar-nav">
                    <a class="nav-link" href="#" data-form="clientes">Clientes</a>
                    <a class="nav-link" href="#" data-form="buscador_clientes">Buscar Clientes</a>
                    <a class="nav-link" href="#" data-form="productos">Productos</a>
                    <a class="nav-link" href="#" data-form="busqueda_productos">Buscar Productos</a>
                    <a class="nav-link" href="#" data-form="impuesto">Impuesto Act. Económicas</a>
                    <a class="nav-link" href="#" data-form="periodos_historicos">Períodos Históricos</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENEDOR DE MÓDULOS -->
    <div class="container-fluid" id="contenedor-ventanas">
        <div id="clientes"></div>
        <div id="buscador_clientes"></div>
        <div id="productos"></div>
        <div id="busqueda_productos"></div>
        <div id="impuesto"></div>
        <div id="periodos_historicos"></div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.14.2/jquery-ui.js"></script>
    <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 1. MENÚ PRINCIPAL
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('[data-form]').forEach(boton => {
                boton.addEventListener('click', (e) => {
                    e.preventDefault();
                    cargarForm(boton.getAttribute('data-form'));
                });
            });
        });

        // 2. CARGAR PANTALLAS
        async function cargarForm(nombreForm) {
            document.querySelectorAll('.position-absolute').forEach(div => div.innerHTML = '');

            let response = await fetch(`/vistas/${nombreForm}/`);
            let html = await response.text();
            document.getElementById(nombreForm).innerHTML = html;
            // Posiciones iniciales para que no se superpongan
            let divVentana = document.getElementById(nombreForm);
            divVentana.style.left = (nombreForm === 'buscador_clientes') ? '650px' : '50px';
            divVentana.style.top = '20px';

            // Si es la pantalla de admin, disparamos la carga
            if (nombreForm === 'clientes') {
                document.getElementById('btnGuardarCliente').onclick = (e) => { e.preventDefault(); guardarClientes(); };
                document.getElementById('btnBuscarCliente').onclick = (e) => { e.preventDefault(); cargarForm('buscador_clientes'); };
                document.getElementById('btnLimpiarCliente').onclick = (e) => { e.preventDefault(); limpiarFormularioCliente(); };
            }

            // Si es el buscador, disparamos la búsqueda inicial
            if (nombreForm === 'buscador_clientes') {
                // Esperamos un poquito a que el HTML se dibuje
                setTimeout(() => {
                    let inputBuscar = document.getElementById('txtBuscarCliente');
                    if (inputBuscar) {
                        // Si escriben, busca
                        inputBuscar.onkeyup = (e) => obtenerClientes(e.target.value);
                        // Busca todos al abrir
                        obtenerClientes();
                    }
                }, 50); // 50 milisegundos es suficiente
            }
            document.querySelectorAll('.btn-close').forEach(btn => {
                btn.onclick = (e) => {
                    e.preventDefault();
                    document.getElementById(nombreForm).innerHTML = '';
                };
            });
        }

        // 3. GUARDAR CLIENTE
        async function guardarClientes() {
            let datos = {
                codigo: document.getElementById('txtCodigoCliente').value,
                nombre: document.getElementById('txtNombreCliente').value,
                direccion: document.getElementById('txtDireccionCliente').value,
                telefono: document.getElementById('txtTelefonoCliente').value,
                email: document.getElementById('txtEmailCliente').value,
                tipo: document.getElementById('cboTipoPersona').value,
                accion: 'nuevo',
                idCliente: ''
            };

            try {
                let response = await fetch('/guardar_cliente/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
                let respuesta = await response.json();
                if (respuesta.msg != "ok") { alert("Error: " + respuesta.msg); return; }
                alert("¡Cliente guardado!");
                limpiarFormularioCliente();
            } catch (error) { alert("Error al guardar."); }
        }

        function limpiarFormularioCliente() {
            document.getElementById('txtCodigoCliente').value = '';
            document.getElementById('txtNombreCliente').value = '';
            document.getElementById('txtDireccionCliente').value = '';
            document.getElementById('txtTelefonoCliente').value = '';
            document.getElementById('txtEmailCliente').value = '';
            document.getElementById('cboTipoPersona').value = 'particular';
        }

        // 4. BUSCAR Y MOSTRAR CLIENTES
        async function obtenerClientes(buscar = "") {
            let response = await fetch(`/buscar_clientes/${buscar}`);
            let respuesta = await response.json();

            // Verificamos que Django nos devuelva la lista
            let listaClientes = respuesta.datos || [];

            let filas = "";
            if (listaClientes.length === 0) {
                filas = '<tr><td colspan="7" class="text-center">No hay clientes</td></tr>';
            } else {
                listaClientes.forEach(e => {
                    filas += `
                    <tr>
                        <td>${e.codigo}</td>
                        <td>${e.nombre}</td>
                        <td>${e.direccion}</td>
                        <td>${e.telefono}</td>
                        <td>${e.email}</td>
                        <td>${e.tipo}</td>
                        <td><button class="btn btn-danger btn-sm">DEL</button></td>
                    </tr>
                `;
                });
            }
            document.getElementById('tblClientes').innerHTML = filas;
        }
        async function eliminarCliente(id) {
            if (confirm("¿Seguro que querés eliminar este cliente?")) {
                let response = await fetch('/guardar_cliente/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accion: 'eliminar', idCliente: id })
                });
                let respuesta = await response.json();
                if (respuesta.msg == "ok") {
                    obtenerClientes(); // Refresca la tabla
                }
            }
        }
        // --- CÓDIGO PARA MOVER LOS CUADROS (Al final de todo) ---
        let ventanaActiva = null;
        let offsetX = 0, offsetY = 0;

        document.addEventListener('mousedown', (e) => {
            if (e.target.closest('.card-header')) {
                ventanaActiva = e.target.closest('.card');

                const rect = ventanaActiva.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;

                document.querySelectorAll('.card').forEach(c => c.style.zIndex = 1000);
                ventanaActiva.style.zIndex = 1001;

                e.preventDefault(); // Evita que se seleccione el texto al arrastrar
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (ventanaActiva) {
                ventanaActiva.style.left = (e.clientX - offsetX) + 'px';
                ventanaActiva.style.top = (e.clientY - offsetY) + 'px';
            }
        });

        document.addEventListener('mouseup', () => {
            ventanaActiva = null;
        });

        // --- TRAER AL FRENTE (Bring to Front) ---
        // Escuchamos cuando hacen clic en cualquier parte de la página
        document.addEventListener('mousedown', (e) => {
            // Buscamos si el clic fue dentro de una ventana (.card)
            const ventanaClickeada = e.target.closest('.card');

            if (ventanaClickeada) {
                // 1. Mandamos TODAS las ventanas al fondo
                document.querySelectorAll('.card').forEach(c => c.style.zIndex = 1000);

                // 2. Mandamos la ventana clickeada al frente
                ventanaClickeada.style.zIndex = 1001;
            }
        });

    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de impuestos a las actividades economicas</title>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css" />
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/default.min.css" />
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/semantic.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.2/themes/base/jquery-ui.css">
    <style>
        #contenedor-ventanas {
            position: relative;
            height: 80vh;
            overflow: hidden;
        }

        .card {
            position: absolute;
            cursor: move;
            z-index: 1000;
            margin: 0;
        }

        .card-body,
        .card-footer {
            cursor: default;
        }
    </style>
</head>

<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">::.. SISTEMA DE IMPUESTOS A LAS ACTIVIDADES ECONOMICAS ..::</a>
            <div class="collapse navbar-collapse" id="mnxImpuestos">
                <div class="navbar-nav">
                    <a class="nav-link" href="#" data-form="clientes">Clientes</a>
                    <a class="nav-link" href="#" data-form="buscador_clientes">Buscar Clientes</a>
                    <a class="nav-link" href="#" data-form="productos">Productos</a>
                    <a class="nav-link" href="#" data-form="busqueda_productos">Buscar Productos</a>
                    <a class="nav-link" href="#" data-form="impuesto">Impuesto Act. Económicas</a>
                    <a class="nav-link" href="#" data-form="periodos_historicos">Períodos Históricos</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENEDOR DE MÓDULOS -->
    <div class="container-fluid" id="contenedor-ventanas">
        <div id="clientes"></div>
        <div id="buscador_clientes"></div>
        <div id="productos"></div>
        <div id="busqueda_productos"></div>
        <div id="impuesto"></div>
        <div id="periodos_historicos"></div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.14.2/jquery-ui.js"></script>
    <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 1. MENÚ PRINCIPAL
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('[data-form]').forEach(boton => {
                boton.addEventListener('click', (e) => {
                    e.preventDefault();
                    cargarForm(boton.getAttribute('data-form'));
                });
            });
        });

        // 2. CARGAR PANTALLAS
        async function cargarForm(nombreForm) {
            let contenedor = document.getElementById(nombreForm);

            // Si ya está abierto, solo lo traemos al frente
            if (contenedor.innerHTML.trim() !== "") {
                document.querySelectorAll('.card').forEach(c => c.style.zIndex = 1000);
                contenedor.style.zIndex = 1001;
                return;
            }

            // Si no está abierto, cargamos el HTML
            let response = await fetch(`/vistas/${nombreForm}/`);
            let html = await response.text();
            contenedor.innerHTML = html;

            // Posición inicial
            let offset = document.querySelectorAll('.card').length * 30;
            contenedor.style.left = (nombreForm.includes('buscador') || nombreForm.includes('busqueda')) ? (600 + offset) + 'px' : (50 + offset) + 'px';
            contenedor.style.top = (20 + offset) + 'px';
            contenedor.style.zIndex = 1001;

            // EVENTOS DE CLIENTES
            if (nombreForm === 'clientes') {
                document.getElementById('btnGuardarCliente').onclick = (e) => { e.preventDefault(); guardarClientes(); };
                document.getElementById('btnBuscarCliente').onclick = (e) => { e.preventDefault(); cargarForm('buscador_clientes'); };
                document.getElementById('btnLimpiarCliente').onclick = (e) => { e.preventDefault(); limpiarFormularioCliente(); };
            }

            if (nombreForm === 'buscador_clientes') {
                setTimeout(() => {
                    let inputBuscar = document.getElementById('txtBuscarCliente');
                    if (inputBuscar) {
                        inputBuscar.onkeyup = (e) => obtenerClientes(e.target.value);
                        obtenerClientes();
                    }
                }, 50);
            }

            // EVENTOS DE PRODUCTOS
            if (nombreForm === 'productos') {
                document.getElementById('btnGuardarProducto').onclick = (e) => { e.preventDefault(); guardarProducto(); };
                document.getElementById('btnBuscarProducto').onclick = (e) => { e.preventDefault(); cargarForm('busqueda_productos'); };
                document.getElementById('btnLimpiarProducto').onclick = (e) => { e.preventDefault(); limpiarFormularioProducto(); };
            }

            if (nombreForm === 'busqueda_productos') {
                setTimeout(() => {
                    let inputBuscarProd = document.getElementById('txtBuscarProducto');
                    if (inputBuscarProd) {
                        inputBuscarProd.onkeyup = (e) => obtenerProductos(e.target.value);
                        obtenerProductos();
                    }
                }, 50);
            }

            // EVENTO PARA CERRAR (La X)
            document.querySelectorAll('.btn-close').forEach(btn => {
                btn.onclick = (e) => {
                    e.preventDefault();
                    contenedor.innerHTML = '';
                };
            });
        }

        // ==========================================
        // FUNCIONES DE CLIENTES
        // ==========================================
        async function guardarClientes() {
            let datos = {
                codigo: document.getElementById('txtCodigoCliente').value,
                nombre: document.getElementById('txtNombreCliente').value,
                direccion: document.getElementById('txtDireccionCliente').value,
                telefono: document.getElementById('txtTelefonoCliente').value,
                email: document.getElementById('txtEmailCliente').value,
                tipo: document.getElementById('cboTipoPersona').value,
                accion: 'nuevo',
                idCliente: ''
            };

            try {
                let response = await fetch('/guardar_cliente/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
                let respuesta = await response.json();
                if (respuesta.msg != "ok") { alert("Error: " + respuesta.msg); return; }
                alert("¡Cliente guardado!");
                limpiarFormularioCliente();
            } catch (error) { alert("Error al guardar."); }
        }

        function limpiarFormularioCliente() {
            document.getElementById('txtCodigoCliente').value = '';
            document.getElementById('txtNombreCliente').value = '';
            document.getElementById('txtDireccionCliente').value = '';
            document.getElementById('txtTelefonoCliente').value = '';
            document.getElementById('txtEmailCliente').value = '';
            document.getElementById('cboTipoPersona').value = 'particular';
        }

        async function obtenerClientes(buscar = "") {
            let response = await fetch(`/buscar_clientes/${buscar}`);
            let respuesta = await response.json();
            let listaClientes = respuesta.datos || [];
            let filas = "";

            if (listaClientes.length === 0) {
                filas = '<tr><td colspan="7" class="text-center">No hay clientes</td></tr>';
            } else {
                listaClientes.forEach(e => {
                    filas += `
                    <tr>
                        <td>${e.codigo}</td>
                        <td>${e.nombre}</td>
                        <td>${e.direccion}</td>
                        <td>${e.telefono}</td>
                        <td>${e.email}</td>
                        <td>${e.tipo}</td>
                        <td><button onclick="eliminarCliente(${e.id})" class="btn btn-danger btn-sm">DEL</button></td>
                    </tr>`;
                });
            }
            document.getElementById('tblClientes').innerHTML = filas;
        }

        async function eliminarCliente(id) {
            if (confirm("¿Seguro que querés eliminar este cliente?")) {
                let response = await fetch('/guardar_cliente/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accion: 'eliminar', idCliente: id })
                });
                let respuesta = await response.json();
                if (respuesta.msg == "ok") {
                    obtenerClientes();
                }
            }
        }

        // ==========================================
        // FUNCIONES DE PRODUCTOS
        // ==========================================
        async function guardarProducto() {
            let datos = {
                codigo: document.getElementById('txtCodigoProducto').value,
                nombre: document.getElementById('txtNombreProducto').value,
                marca: document.getElementById('txtMarcaProducto').value,
                precio: document.getElementById('txtPrecioProducto').value,
                accion: 'nuevo',
                idProducto: ''
            };

            try {
                let response = await fetch('/guardar_producto/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
                let respuesta = await response.json();
                if (respuesta.msg != "ok") { alert("Error: " + respuesta.msg); return; }
                alert("¡Producto guardado!");
                limpiarFormularioProducto();
            } catch (error) { alert("Error al guardar producto."); }
        }

        function limpiarFormularioProducto() {
            document.getElementById('txtCodigoProducto').value = '';
            document.getElementById('txtNombreProducto').value = '';
            document.getElementById('txtMarcaProducto').value = '';
            document.getElementById('txtPrecioProducto').value = '';
        }

        async function obtenerProductos(buscar = "") {
            let response = await fetch(`/buscar_productos/${buscar}`);
            let respuesta = await response.json();
            let lista = respuesta.datos || [];
            let filas = "";

            if (lista.length === 0) {
                filas = '<tr><td colspan="5" class="text-center">No hay productos</td></tr>';
            } else {
                lista.forEach(e => {
                    filas += `
                    <tr>
                        <td>${e.codigo}</td>
                        <td>${e.nombre}</td>
                        <td>${e.marca}</td>
                        <td>${e.precio}</td>
                        <td><button onclick="eliminarProducto(${e.id})" class="btn btn-danger btn-sm">DEL</button></td>
                    </tr>`;
                });
            }
            document.getElementById('tblProductos').innerHTML = filas;
        }

        async function eliminarProducto(id) {
            if (confirm("¿Seguro que querés eliminar este producto?")) {
                let response = await fetch('/guardar_producto/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accion: 'eliminar', idProducto: id })
                });
                let respuesta = await response.json();
                if (respuesta.msg == "ok") {
                    obtenerProductos();
                }
            }
        }

        // ==========================================
        // LÓGICA DE VENTANAS (MOVER Y TRAER AL FRENTE)
        // ==========================================
        let ventanaActiva = null;
        let offsetX = 0, offsetY = 0;

        document.addEventListener('mousedown', (e) => {
            const ventanaClickeada = e.target.closest('.card');
            if (ventanaClickeada) {
                document.querySelectorAll('.card').forEach(c => c.style.zIndex = 1000);
                ventanaClickeada.style.zIndex = 1001;

                if (e.target.closest('.card-header')) {
                    ventanaActiva = ventanaClickeada;
                    const rect = ventanaActiva.getBoundingClientRect();
                    offsetX = e.clientX - rect.left;
                    offsetY = e.clientY - rect.top;
                    e.preventDefault();
                }
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (ventanaActiva) {
                ventanaActiva.style.left = (e.clientX - offsetX) + 'px';
                ventanaActiva.style.top = (e.clientY - offsetY) + 'px';
            }
        });

        document.addEventListener('mouseup', () => {
            ventanaActiva = null;
        });
    </script>
</body>

</html>

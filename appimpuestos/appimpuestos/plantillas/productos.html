<form id="frmProducto">
    <div class="card text-bg-dark mb-3" style="min-width: 600px;">
        <div class="card-header">
            <div class="d-flex">
                Admin de Productos
                <div class="ms-auto">
                    <button data-form="productos" type="button" class="btn-close btn-close-white"
                        aria-label="Close"></button>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div class="row p-1">
                <div class="col-12 col-md-4">
                    <input required placeholder="Codigo" name="txtCodigoProducto" id="txtCodigoProducto"
                        class="form-control" type="text">
                </div>
            </div>
            <div class="row p-1">
                <div class="col-12 col-md-8">
                    <input required placeholder="Nombre" name="txtNombreProducto" id="txtNombreProducto"
                        class="form-control" type="text">
                </div>
            </div>
            <div class="row p-1">
                <div class="col-12 col-md-6">
                    <input placeholder="Marca" name="txtMarcaProducto" id="txtMarcaProducto" class="form-control"
                        type="text">
                </div>
            </div>
            <div class="row p-1">
                <div class="col-12 col-md-4">
                    <input placeholder="Precio" name="txtPrecioProducto" id="txtPrecioProducto" class="form-control"
                        type="number" step="0.01">
                </div>
            </div>
        </div>
        <div class="card-footer text-center">
            <input type="button" value="Guardar" class="btn btn-primary" id="btnGuardarProducto">
            <input type="button" value="Buscar" class="btn btn-secondary" id="btnBuscarProducto">
            <input type="reset" value="Limpiar" class="btn btn-warning" id="btnLimpiarProducto">
        </div>
    </div>
</form>
